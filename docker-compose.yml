# Convex images are pinned by digest to a tested upstream build. Docker uses the
# digest and ignores the tag. Dependabot (.github/dependabot.yml) opens a PR to
# move the pins when Convex publishes a new `latest`; backend and dashboard move
# together. Test the full self-host flow before merging those PRs.
services:
  convex-backend:
    image: ghcr.io/convex/convex-backend:latest@sha256:d4e012c68640830310139632481f8d1c1915bdf66de5c3a594a99799eab51679
    restart: unless-stopped
    ports:
      - '3210:3210'
      - '3211:3211'
    volumes:
      - convex-data:/convex/data
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - CONVEX_CLOUD_ORIGIN=${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
      - CONVEX_SITE_ORIGIN=${NEXT_PUBLIC_CONVEX_SITE_URL:-http://localhost:3211}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3210/version']
      interval: 5s
      timeout: 3s
      retries: 10
    stop_signal: SIGINT
    stop_grace_period: 10s

  convex-admin-key:
    image: ghcr.io/convex/convex-backend:latest@sha256:d4e012c68640830310139632481f8d1c1915bdf66de5c3a594a99799eab51679
    restart: 'no'
    depends_on:
      convex-backend:
        condition: service_healthy
    volumes:
      - convex-data:/convex/data
      - convex-credentials:/credentials
      - ./scripts/convex-admin-key.sh:/usr/local/bin/convex-admin-key.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/convex-admin-key.sh']

  convex-init:
    image: ghcr.io/schelskedevco/ignidash-convex-init:${IGNIDASH_TAG:-stable}
    restart: 'no'
    depends_on:
      convex-backend:
        condition: service_healthy
      convex-admin-key:
        condition: service_completed_successfully
    env_file:
      - .env.local
    environment:
      - CONVEX_SELF_HOSTED_URL=http://convex-backend:3210
      - CONVEX_ADMIN_KEY_FILE=/run/ignidash/admin-key
      - SELF_HOSTED=true
    volumes:
      - convex-credentials:/run/ignidash:ro

  convex-dashboard:
    image: ghcr.io/convex/convex-dashboard:latest@sha256:2cb0f7e51597ea41d08147649f9f65cb2676aa96ce1f2fce1531116a408e1c98
    restart: unless-stopped
    ports:
      - '6791:6791'
    depends_on:
      convex-backend:
        condition: service_healthy
    environment:
      - CONVEX_BACKEND_URL=http://convex-backend:3210
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
    stop_signal: SIGINT
    stop_grace_period: 10s

  app:
    image: ghcr.io/schelskedevco/ignidash:${IGNIDASH_TAG:-stable}
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      convex-init:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - SELF_HOSTED_CONVEX_URL=http://convex-backend:3210
      - SELF_HOSTED_CONVEX_SITE_URL=http://convex-backend:3211
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
      - NEXT_PUBLIC_CONVEX_SITE_URL=${NEXT_PUBLIC_CONVEX_SITE_URL:-http://localhost:3211}
      # Read at runtime by the Next.js server (src/lib/posthog-server.ts). Not secret.
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_signal: SIGINT
    stop_grace_period: 10s

volumes:
  convex-data:
  convex-credentials:

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3 # don't take releases newer than 3 days (supply-chain buffer)
      semver-major-days: 14
    groups:
      better-auth: # peer deps; must move in lockstep
        patterns: ['better-auth', '@better-auth/*', '@convex-dev/better-auth']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major'] # keep matched to the engines.node floor in package.json

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major'] # bump by hand alongside .nvmrc

  # Self-hosted Convex images in docker-compose.yml are pinned as latest@sha256:<digest>.
  # Dependabot can't bump Convex's commit-SHA tags, but it does refresh the digest when
  # `latest` moves. The Ignidash images use ${IGNIDASH_TAG:-stable} and are skipped.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # let upstream regressions surface before pinning a new build
    groups:
      convex-self-hosted: # backend and dashboard must stay on the same build
        patterns: ['convex/convex-backend', 'convex/convex-dashboard']

name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22: engines.node floor
        # 24: .nvmrc, Docker image, Convex Node actions
        # 26: Vercel (engines ">=22" resolves to its newest major)
        node-version: ['22', '24', '26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test

  # Scans every commit for secrets with gitleaks and .gitleaks.toml (default rules
  # plus Convex keys and Ignidash's own settings), and tests those rules.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit, not just the latest

      - name: Scan the full history for secrets
        run: sh scripts/check-secrets.sh --history

      - name: Test the secret scanning rules
        run: sh scripts/check-secrets.test.sh

  selfhost:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check self-hosting scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck scripts/*.sh

      - name: Run self-hosting script and configuration tests
        run: |
          sh scripts/selfhost.test.sh
          sh scripts/selfhost.config.test.sh

  # Builds both images and runs every scenario in SELF_HOSTING.md against real
  # containers and a real browser: quick start, manual install with LAN access
  # and changed ports, HTTPS reverse proxy, backups, key recovery, and upgrading
  # from the previous release. See scripts/selfhost.e2e.sh.
  selfhost-e2e:
    # Pinned: Playwright 1.58 cannot install Chromium on ubuntu-latest (26.04).
    # Move to ubuntu-latest once Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release tags, for the upgrade scenario

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Convex initializer image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: convex-init
          load: true
          tags: ghcr.io/schelskedevco/ignidash-convex-init:e2e
          cache-from: type=gha,scope=selfhost-e2e-convex-init
          cache-to: type=gha,mode=max,scope=selfhost-e2e-convex-init

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ghcr.io/schelskedevco/ignidash:e2e
          build-args: |
            SELF_HOSTED=true
            NEXT_PUBLIC_CONVEX_URL=http://localhost:3210
            NEXT_PUBLIC_CONVEX_SITE_URL=http://localhost:3211
          cache-from: type=gha,scope=selfhost-e2e-app
          cache-to: type=gha,mode=max,scope=selfhost-e2e-app

      - name: Resolve reverse proxy test hostnames locally
        run: echo '127.0.0.1 localtest.me api.localtest.me actions.localtest.me' | sudo tee -a /etc/hosts

      - name: Find the previous release
        run: |
          git fetch --force --tags origin
          previous=$(git tag --list 'v*' --merged HEAD --no-contains HEAD --sort=-v:refname | head -n 1)
          echo "Upgrading from: ${previous:-none found}"
          echo "SELFHOST_E2E_PREVIOUS_RELEASE=$previous" >> "$GITHUB_ENV"

      - name: Run self-hosting end-to-end tests
        env:
          SELFHOST_E2E_SKIP_BUILD: '1'
          SELFHOST_E2E_ARTIFACTS: ${{ runner.temp }}/selfhost-e2e
        run: sh scripts/selfhost.e2e.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: selfhost-e2e-logs
          path: ${{ runner.temp }}/selfhost-e2e
          retention-days: 7

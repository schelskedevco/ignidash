name: Docker Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip image tests after build'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  INIT_IMAGE_NAME: ${{ github.repository }}-convex-init

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # ignidash: the Next.js app (runner stage)
        # ignidash-convex-init: one-shot Convex deploy/migrate image (convex-init stage)
        image: [ignidash, ignidash-convex-init]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: ignidash
            target: runner
          - image: ignidash-convex-init
            target: convex-init

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name
        run: |
          if [[ "${{ matrix.image }}" == "ignidash-convex-init" ]]; then
            echo "IMAGE=${{ env.REGISTRY }}/${{ env.INIT_IMAGE_NAME }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SELF_HOSTED=true
            NEXT_PUBLIC_CONVEX_URL=http://localhost:3210
            NEXT_PUBLIC_CONVEX_SITE_URL=http://localhost:3211
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          # Image name last: a prefix pattern like digests-ignidash-* would also match
          # digests-ignidash-convex-init-*, mixing the two images' digests.
          name: digests-${{ matrix.runner }}--${{ matrix.image }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ignidash
            title: Ignidash
            description: Self-hosted Ignidash application
          - image: ignidash-convex-init
            title: Ignidash Convex Init
            description: One-shot initializer that deploys Ignidash's Convex functions and runs migrations

    steps:
      - name: Resolve image name
        run: |
          if [[ "${{ matrix.image }}" == "ignidash-convex-init" ]]; then
            echo "IMAGE=${{ env.REGISTRY }}/${{ env.INIT_IMAGE_NAME }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_ENV"
          fi

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*--${{ matrix.image }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # Push to main: latest + sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,enable={{is_default_branch}}
            # Tags/releases: stable + semver versions
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # Fallback for workflow_dispatch on non-main branches
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=SchelskeDevCo

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  test:
    runs-on: ubuntu-latest
    needs: merge
    if: ${{ !inputs.skip_tests }}
    permissions:
      packages: read

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            TAG="stable"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="latest"
          else
            TAG="${GITHUB_REF_NAME//\//-}"
          fi
          echo "Using tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Test amd64 image
        run: |
          echo "Testing amd64 image..."
          NODE_VERSION=$(docker run --rm --platform linux/amd64 --entrypoint node ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG --version)
          echo "Node version: $NODE_VERSION"
          if [[ "$NODE_VERSION" != v24.* ]]; then
            echo "::error::Expected Node v24.x in image, got $NODE_VERSION"
            exit 1
          fi
          echo "Image test passed"

      - name: Test amd64 Convex init image
        run: |
          echo "Testing amd64 Convex init image..."
          IMAGE=${{ env.REGISTRY }}/${{ env.INIT_IMAGE_NAME }}:$TAG
          NODE_VERSION=$(docker run --rm --platform linux/amd64 --entrypoint node "$IMAGE" --version)
          echo "Node version: $NODE_VERSION"
          if [[ "$NODE_VERSION" != v24.* ]]; then
            echo "::error::Expected Node v24.x in init image, got $NODE_VERSION"
            exit 1
          fi
          CONVEX_VERSION=$(docker run --rm --platform linux/amd64 --entrypoint /app/node_modules/.bin/convex "$IMAGE" --version)
          echo "Convex CLI version: $CONVEX_VERSION"
          echo "Init image test passed"

  summary:
    runs-on: ubuntu-latest
    needs: [merge, test]
    if: always() && needs.merge.result == 'success'
    permissions:
      packages: read

    steps:
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

      - name: Generate build summary
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.INIT_IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags (same for both images)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms" >> $GITHUB_STEP_SUMMARY
          echo "- \`linux/amd64\` (native runner)" >> $GITHUB_STEP_SUMMARY
          echo "- \`linux/arm64\` (native runner)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            TAG="stable"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="latest"
          else
            TAG="${GITHUB_REF_NAME//\//-}"
          fi
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.INIT_IMAGE_NAME }}:$TAG" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
